# Kinship AI evals (plan §10). Calling a model costs money, so this never
# runs on its own:
#   * Actions → "AI evals" → Run workflow: one model/effort of your choice.
#   * Label a pull request `run-evals-smoke`: the locked live smoke set
#     (evals/extraction/smoke.json, 29 fixtures) on Opus 5.5 at low effort
#     only, about $1. The founder authorises each paid stage separately.
#   * Label a pull request `run-evals-full`: the whole frozen corpus on Opus
#     5.5 at low effort only (stage 2), about $3.50. Refuses to run if the
#     corpus differs from evals/extraction/MANIFEST.json.
#   * Label a pull request `run-evals`: the model comparison (Opus 5.5 at
#     low and medium effort, Sonnet 5.5, Haiku 4.5), about $25 at list prices.
# Needs the ANTHROPIC_API_KEY repository secret. Results are kept as a
# workflow artifact for 90 days and printed to the run summary.
name: AI evals

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to evaluate
        default: claude-opus-5-5
        type: choice
        options: [claude-opus-5-5, claude-sonnet-5-5, claude-haiku-4-5]
      effort:
        description: Effort (none for Haiku 4.5, which has no effort control)
        default: low
        type: choice
        options: [low, medium, high, none]
      sets:
        description: Comma-separated sets
        default: core,ambiguity,dates,sensitive,adversarial,merge
      repeat:
        description: Runs per fixture
        default: "1"
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  single:
    name: relationship_extract (${{ inputs.model }}, ${{ inputs.effort }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          deno run -A --config evals/deno.json evals/extraction/run.ts --mode live \
            --model "${{ inputs.model }}" --effort "${{ inputs.effort }}" \
            --sets "${{ inputs.sets }}" --repeat "${{ inputs.repeat }}" \
            --concurrency 4 --out evals/results | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ inputs.model }}-${{ inputs.effort }}-${{ github.run_id }}
          path: evals/results/
          retention-days: 90

  compare:
    name: relationship_extract (${{ matrix.model }}, ${{ matrix.effort }})
    if: github.event_name == 'pull_request' && github.event.label.name == 'run-evals'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { model: claude-opus-5-5, effort: low }
          - { model: claude-opus-5-5, effort: medium }
          - { model: claude-sonnet-5-5, effort: low }
          - { model: claude-haiku-4-5, effort: none }
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          deno run -A --config evals/deno.json evals/extraction/run.ts --mode live \
            --model "${{ matrix.model }}" --effort "${{ matrix.effort }}" \
            --concurrency 4 --out evals/results | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.model }}-${{ matrix.effort }}-${{ github.run_id }}
          path: evals/results/
          retention-days: 90

  smoke:
    name: relationship_extract smoke (claude-opus-5-5, low)
    if: github.event_name == 'pull_request' && github.event.label.name == 'run-evals-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch head itself, so the run is reproducible from a commit.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          deno run -A --config evals/deno.json evals/extraction/run.ts --mode live --smoke \
            --model claude-opus-5-5 --effort low \
            --concurrency 4 --out evals/results | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Print the results JSON (fixtures are synthetic; no user data)
        if: always()
        run: |
          for f in evals/results/*.json; do echo "::group::$f"; cat "$f"; echo; echo "::endgroup::"; done
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-claude-opus-5-5-low-${{ github.run_id }}
          path: evals/results/
          retention-days: 90

  full:
    name: relationship_extract full corpus (claude-opus-5-5, low)
    if: github.event_name == 'pull_request' && github.event.label.name == 'run-evals-full'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          deno run -A --config evals/deno.json evals/extraction/run.ts --mode live --require-frozen \
            --model claude-opus-5-5 --effort low \
            --concurrency 4 --out evals/results | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Print the results JSON (fixtures are synthetic; no user data)
        if: always()
        run: |
          for f in evals/results/*.json; do echo "::group::$f"; cat "$f"; echo; echo "::endgroup::"; done
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-full-claude-opus-5-5-low-${{ github.run_id }}
          path: evals/results/
          retention-days: 90
